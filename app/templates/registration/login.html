
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title></title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  {% load static %}
  <link rel="stylesheet" href="{% static '/css/estilos.css'%}">
  

  <style>
    body {
      background: url("{% static 'img/walll.jpg' %}")no-repeat;
      background-size: cover;
      background-position: left; /* Cambia 'left' a 'right' para mover a la derecha */
      height: 100vh;
      margin: 0;
  }
    </style>

  
    </head>
    <body>
      {% if mensaje %}
            <div class="alert alert-warning mt-3">{{ mensaje }}</div>
            {% endif %}
            <div>
      <div class="container">
        
        <div class="card">
           <div class="regis">
             <a href="{% url 'home' %}">
               <img class="imagen" src="{% static 'img/flecha-correcta.png' %}" alt="Flecha" />
           </a>
                   
           </div>
            <h2> INICIAR SESIÓN </h2>
            <hr>
            <form action="" method="post">
              {% csrf_token %}
                <div class="input-box">
                  <input type="text" name="username"  placeholder="Nombre de Usuario" required>
                </div>
                
                <div class="input-box">
                  <input type="password" name="password" placeholder="Contraseña" required>
                </div>
                
                <input class="btn-login"  type="submit" value="Ingresar">
                <div class="create-count">
                  <p>¿ aún no tienes cuenta?</p> <a href="{% url 'registro' %}">Registrarme</a>
                </div>
              </div>
              
            </form>
            
        <div>
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    </body>
</html>
