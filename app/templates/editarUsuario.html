{% extends "base.html" %}
{% block body %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/estilos.css' %}">

<div class="row">
    <div class="col-sm-12 col-md-6 col-lg-4 mx-auto p-2">
        <h2 class="mt-3 mb-3 text-center">EDITAR USUARIO</h2>
        
        <!-- Mensajes de éxito/error -->
        {% if messages %}
            <div class="alert alert-info">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Formulario -->
         <div class="card bg-warning p-20"> 
           <div class="card-body bg-success mt-3"> 
                <form action="" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <!-- <div class="form-group mb-3"> -->
                        {{ formulario.as_p }}
                        <button type="submit" class="btn btn-success btn-block text-white save-button">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
