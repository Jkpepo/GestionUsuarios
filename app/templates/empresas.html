{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/estilos.css'%}">
{% block body %}
    <h1 class="text-center"> {{empresa.nombre}}</h1>
    <h1> Empleados:</h1>

  <div class="contenedor-empleados">
    
 
  <table class="table table-striped table-dark table align-middle">
          
  
    <tr>
        <th colspan="2">Nombre</th>
        <th >Cargo</th>
    
    </tr>
       <tbody>
         {% if usuario %}
            {% for u in usuario%}  
            <tr>
              <td colspan="2">{{ u.nombres}} {{u.apellidos}}</td>
              <td colspan="3">{{ u.cargo }}</td>
            </tr>
            {% endfor %}
          {% else %}  
       
    <tr> 
      <td colspan="11">No hay usuarios disponibles.</td> 
    </tr>
    {% endif %}
  </tbody>
</table>
</div>
    
{% endblock %}
