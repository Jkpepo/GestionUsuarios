<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title></title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/estilos.css'%}">
    </head>
    <body>
      
        <nav class=" navbar-expand-lg  ">
          <div class="container-fluid ">
             
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                  <a class="navbar-brand " href="#">Navbar</a>
                  <a class="nav-link active" aria-current="page" href="/">Home</a>
                  <a class="nav-link" href="/lista">Lista de empleados</a>
                  <a class="nav-link" href="/registrar_usuario">Registrar Usuario</a>
                  <a class="nav-link" href="/registrar_empresa">Registrar Empresa</a>
                  
                   {% if user.is_authenticated %}
                   <a  class="username"href="/perfilUsuario">@{{ user.username}}</a>
                  <form action="{% url 'logout' %}" method="post" >
                  {% csrf_token %}
                  <button type="submit" class="btn btn-link">Cerrar sesión</button>
                  
                 </form>
                 
                {% else %}
                <a href="{% url 'login' %}">Iniciar sesión</a>
                {% endif %}
                 
                </div>
              </div>
            </div>
          </div>
          </nav>
         

          {% block body %}

          {% endblock %}
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    </body>
</html>
